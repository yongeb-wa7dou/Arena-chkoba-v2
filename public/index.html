<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chkoba</title><style>body{margin:0;background:#0a3d2e;color:#fff;font-family:sans-serif;text-align:center}h1{margin:10px}#t{background:#0f5c45;margin:10px;border-radius:12px;padding:10px;min-height:120px}.c{display:inline-block;width:55px;height:80px;background:#fff;color:#000;border-radius:6px;margin:3px;line-height:80px;font-weight:bold}button.c{border:0}</style></head><body><h1>Arena Chkoba</h1><div>Toi:<span id=p>0</span> - IA:<span id=b>0</span></div><div id=t></div><div id=m>Joue!</div><div id=h></div><script>let d=[],t=[],h=[],o=[],ps=0,bs=0,s=['♥','♦','♣','♠'];function N(){d=[];for(a of s)for(v=1;v<11;v++)d.push({v,a});d.sort(()=>Math.random()-.5)}function D(n,a){for(i=0;i<n;i++)a.push(d.pop())}function R(){document.getElementById('t').innerHTML=t.map(c=>`<div class=c>${c.v}${c.a}</div>`).join('');document.getElementById('h').innerHTML=h.map((c,i)=>`<button class=c onclick=P(${i})>${c.v}${c.a}</button>`).join('');p.textContent=ps;b.textContent=bs}function C(a,b){return a.v==b.v||a.v+b.v==11}function P(i){let c=h.splice(i,1)[0];let k=t.filter(x=>C(c,x));if(k.length){ps+=k.length+1;t=t.filter(x=>!k.includes(x));m.textContent='+'+(k.length+1)}else{t.push(c);m.textContent='Posée'}R();setTimeout(B,400)}function B(){if(!o.length)return;let c=o.shift();let f=t.find(x=>C(c,x));if(f){bs+=2;t=t.filter(x=>x!=f)}else t.push(c);R()}function S(){N();t=[];h=[];o=[];ps=bs=0;D(4,t);D(3,h);D(3,o);R()}S()</script></body></html>
