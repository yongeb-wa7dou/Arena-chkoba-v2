<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Chkoba vs IA</title>
<style>
body{margin:0;background:#0a2e22;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
header{padding:14px;background:#06231a;text-align:center;font-weight:700}
#table{flex:1;background:radial-gradient(circle,#1b6b4f,#0a2e22);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:20px}
.card{width:70px;height:100px;background:#fff;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;box-shadow:0 4px 8px #0006;cursor:pointer}
.card.red{color:#c00}
#hand{padding:16px;background:#06231a;display:flex;gap:10px;justify-content:center}
#hand .card{background:#fef3c7}
#msg{padding:10px;text-align:center;min-height:24px}
button{padding:12px 20px;background:#f0c24a;border:none;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<header>Arena Chkoba - vs IA</header>
<div id="msg">Clique une carte pour jouer</div>
<div id="table"></div>
<div id="hand"></div>
<div style="padding:10px;text-align:center"><button onclick="start()">Nouvelle partie</button></div>
<script>
const tg = window.Telegram?.WebApp; if(tg) tg.expand();
let deck=[], table=[], myHand=[], aiHand=[], myTaken=[], aiTaken=[];
function newDeck(){const suits=['♥','♦','♣','♠'];let d=[];for(let s of suits)for(let v=1;v<=10;v++)d.push({v,s,txt:v+s,red:s<'♣'});return d.sort(()=>Math.random()-0.5)}
function render(){document.getElementById('table').innerHTML=table.map(c=>`<div class="card ${c.red?'red':''}">${c.txt}</div>`).join('');document.getElementById('hand').innerHTML=myHand.map((c,i)=>`<div class="card ${c.red?'red':''}" onclick="play(${i})">${c.txt}</div>`).join('')}
function msg(t){document.getElementById('msg').innerText=t}
function start(){deck=newDeck();table=deck.splice(0,4);myHand=deck.splice(0,3);aiHand=deck.splice(0,3);myTaken=[];aiTaken=[];render();msg('À toi !')}
function play(i){const c=myHand.splice(i,1)[0];let take=table.find(t=>t.v+c.v===10);if(take){myTaken.push(c,take);table=table.filter(x=>x!==take);msg(`Tu prends ${take.txt}`);if(table.length===0){msg('🔥 CHKOBBA !');myTaken.push({txt:'X'})}}else{table.push(c);msg('Pas de prise')}setTimeout(aiPlay,600);render()}
function aiPlay(){const c=aiHand.shift();let take=table.find(t=>t.v+c.v===10);if(take){aiTaken.push(c,take);table=table.filter(x=>x!==take);msg(`IA prend ${take.txt}`);if(table.length===0)aiTaken.push({txt:'X'})}else table.push(c);if(myHand.length===0&&aiHand.length===0&&deck.length){myHand=deck.splice(0,3);aiHand=deck.splice(0,3);msg('Nouvelle donne')}render()}
start();
</script>
</body>
</html>
